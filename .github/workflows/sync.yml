name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: hisokahunter255/collector-connect
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: falsename: Sync Fork on: schedule: - cron: '0 * * * *' workflow_dispatch: jobs: sync: runs-on: ubuntu-latest permissions: contents: write steps: - name: Checkout target repo uses: actions/checkout@v4 with: fetch-depth: 0 - name: Sync upstream changes uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1 with: upstream_sync_repo: hisokahunter255/collector-connect upstream_sync_branch: main target_sync_branch: main target_repo_token: ${{ secrets.GITHUB_TOKEN }} test_mode: false
